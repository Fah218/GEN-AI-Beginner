<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LinkLens AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>LinkLens AI</h1>
    <p class="subtitle">Your AI Copilot for LinkedIn</p>
    
    <div class="controls" style="margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px;">
      <select id="operation-select" style="padding: 6px; font-size: 14px;">
        <option value="summarize">Summarize</option>
        <option value="explain">Explain</option>
        <option value="keyTakeaways">Key Takeaways</option>
      </select>
      <button id="analyze-btn">Analyze Current Post</button>
    </div>
    
    <div id="status-message"></div>
    <div id="result-box" style="display: none; margin-top: 10px; padding: 10px; background: #f3f2ef; border-radius: 4px; font-size: 14px; white-space: pre-wrap;"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
